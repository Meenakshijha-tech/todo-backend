
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My To-Do App</title>
</head>
<body>
    <h1>My To-Do App</h1>

    <form action="/task" method="GET">
        <label for="title">Enter your task:</label>
        <input
            type="text"
            id="title"
            name="title"
            placeholder="e.g. Complete Java homework"
            required
        >
        <button type="submit">Add Task</button>
    </form>
</body>
</html>
